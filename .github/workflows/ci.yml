name: CI

on:
  push:
    branches: [main, solutions]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['8.4', '8.5']

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: rampart
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      # A03:2025 — Software Supply Chain Failures. A mutable tag like @v4 can be
      # repointed to a different commit at any time (by the action's maintainer, or by
      # anyone who compromises their account) and CI would silently start running whatever
      # that commit contains. A commit SHA can't be repointed — verified directly against
      # actions/checkout's own tag refs (`git ls-remote --tags`), not copied from a
      # third-party writeup.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, redis, zip, gd, bcmath, intl
          coverage: none

      # A03:2025 — Software Supply Chain Failures. When composer.json and composer.lock
      # have drifted apart, `composer install` only prints a warning and installs anyway —
      # which defeats the point of committing a lockfile at all. `composer validate` turns
      # that drift into a failed build.
      - name: Validate composer.json and composer.lock
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: rampart
          DB_USERNAME: root
          DB_PASSWORD: ''
          REDIS_HOST: 127.0.0.1

      - name: Migrate and seed
        run: php artisan migrate --force --seed
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: rampart
          DB_USERNAME: root
          DB_PASSWORD: ''
          REDIS_HOST: 127.0.0.1

      - name: Public test suite
        run: composer test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: rampart
          DB_USERNAME: root
          DB_PASSWORD: ''
          REDIS_HOST: 127.0.0.1

      # On main this suite passing proves the plants are present. Here they're fixed, so
      # the suite is expected to FAIL — assert that every exploit is now blocked instead.
      # --no-output: the expected failures dump whole error pages; the gate reports what
      # matters.
      - name: Hidden exploit suite (proves every plant is fixed)
        run: |
          composer test:exploits -- --no-output --log-junit exploits.xml || true
          php .github/scripts/assert-exploits-fixed.php exploits.xml
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: rampart
          DB_USERNAME: root
          DB_PASSWORD: ''
          REDIS_HOST: 127.0.0.1
