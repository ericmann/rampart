name: CI

on:
  push:
    branches: [main, solutions]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['8.4', '8.5']

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: rampart
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      # A03:2025 — Software Supply Chain Failures. A mutable tag like @v4 can be
      # repointed to a different commit at any time (by the action's maintainer, or by
      # anyone who compromises their account) and CI would silently start running whatever
      # that commit contains. A commit SHA can't be repointed — verified directly against
      # actions/checkout's own tag refs (`git ls-remote --tags`), not copied from a
      # third-party writeup.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, redis, zip, gd, bcmath, intl
          coverage: none

      # A03:2025 — Software Supply Chain Failures. --locked fails the build if
      # composer.json and composer.lock have drifted apart, instead of composer silently
      # re-resolving and installing whatever satisfies composer.json at that moment —
      # which defeats the point of committing a lockfile at all.
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --locked

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: rampart
          DB_USERNAME: root
          DB_PASSWORD: ''
          REDIS_HOST: 127.0.0.1

      - name: Migrate and seed
        run: php artisan migrate --force --seed
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: rampart
          DB_USERNAME: root
          DB_PASSWORD: ''
          REDIS_HOST: 127.0.0.1

      - name: Public test suite
        run: composer test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: rampart
          DB_USERNAME: root
          DB_PASSWORD: ''
          REDIS_HOST: 127.0.0.1

      - name: Hidden exploit suite (proves the plants are all still present)
        run: composer test:exploits
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: rampart
          DB_USERNAME: root
          DB_PASSWORD: ''
          REDIS_HOST: 127.0.0.1
