name: rampart

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
    image: rampart-app
    pull_policy: never
    ports:
      # Bound to localhost only — this app is deliberately vulnerable and must never be
      # reachable from your LAN/wifi. Change the host side at your own risk.
      - "127.0.0.1:8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: rampart
      DB_USERNAME: rampart
      DB_PASSWORD: rampart
      REDIS_HOST: redis
      REDIS_PORT: 6379
      METADATA_MOCK_HOST: metadata.internal
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      metadata-mock:
        condition: service_started
    networks:
      default:
      internal-only:

  mysql:
    image: mysql:8.4
    pull_policy: never
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: rampart
      MYSQL_USER: rampart
      MYSQL_PASSWORD: rampart
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      default:

  redis:
    image: redis:7-alpine
    pull_policy: never
    restart: unless-stopped
    networks:
      default:

  # Fake internal "cloud metadata" endpoint, reachable only from the app container
  # (internal-only network, no published ports) at http://metadata.internal/latest/meta-data/.
  metadata-mock:
    build:
      context: ./mock/metadata
    image: rampart-metadata-mock
    pull_policy: never
    networks:
      internal-only:
        aliases:
          - metadata.internal

networks:
  default:
  internal-only:
    internal: true

volumes:
  mysql-data:
  app-storage:
